<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Risk Predictor</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <main class="page">

    <header class="hero">
      <div class="hero-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <h1>Credit Risk Predictor</h1>
      <p>Enter applicant details to get an instant, model-driven risk assessment</p>
    </header>

    <section class="card">
      <form id="loanForm" autocomplete="off">

        <div class="grid">

          <div class="field">
            <label for="person_age">Age</label>
            <input type="number" id="person_age" min="18" max="100" step="1" value="28" required>
          </div>

          <div class="field">
            <label for="person_income">Annual Income ($)</label>
            <input type="number" id="person_income" min="0" step="100" value="55000" required>
          </div>

          <div class="field">
            <label for="person_home_ownership">Home Ownership</label>
            <select id="person_home_ownership" required>
              <option value="RENT">Rent</option>
              <option value="MORTGAGE">Mortgage</option>
              <option value="OWN">Own</option>
              <option value="OTHER">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="person_emp_length">Employment Length (yrs)</label>
            <input type="number" id="person_emp_length" min="0" max="60" step="0.5" value="4" required>
          </div>

          <div class="field">
            <label for="loan_intent">Loan Intent</label>
            <select id="loan_intent" required>
              <option value="PERSONAL">Personal</option>
              <option value="EDUCATION">Education</option>
              <option value="MEDICAL">Medical</option>
              <option value="VENTURE">Venture</option>
              <option value="HOMEIMPROVEMENT">Home Improvement</option>
              <option value="DEBTCONSOLIDATION">Debt Consolidation</option>
            </select>
          </div>

          <div class="field">
            <label for="loan_grade">Loan Grade</label>
            <select id="loan_grade" required>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
              <option value="E">E</option>
              <option value="F">F</option>
              <option value="G">G</option>
            </select>
          </div>

          <div class="field">
            <label for="loan_amnt">Loan Amount ($)</label>
            <input type="number" id="loan_amnt" min="500" step="100" value="10000" required>
          </div>

          <div class="field">
            <label for="loan_int_rate">Interest Rate (%)</label>
            <input type="number" id="loan_int_rate" min="0" max="40" step="0.01" value="11.5" required>
          </div>

          <div class="field">
            <label for="loan_percent_income">
              Loan / Income Ratio
              <span class="hint">auto-calculated</span>
            </label>
            <input type="number" id="loan_percent_income" min="0" max="2" step="0.01" readonly>
          </div>

          <div class="field">
            <label for="cb_person_default_on_file">Prior Default on File</label>
            <select id="cb_person_default_on_file" required>
              <option value="N">No</option>
              <option value="Y">Yes</option>
            </select>
          </div>

          <div class="field">
            <label for="cb_person_cred_hist_length">Credit History Length (yrs)</label>
            <input type="number" id="cb_person_cred_hist_length" min="0" max="60" step="1" value="5" required>
          </div>

        </div>

        <div class="actions">
          <button type="submit" id="submitBtn" class="btn-primary">
            <span class="btn-label">Analyze Risk</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
          <button type="reset" id="resetBtn" class="btn-ghost">Reset</button>
        </div>

        <p id="errorMsg" class="error-msg" role="alert"></p>

      </form>
    </section>

    <section id="resultCard" class="card result-card">
      <div class="result-top">
        <div class="gauge-wrap">
          <svg viewBox="0 0 120 120" class="gauge">
            <circle cx="60" cy="60" r="50" class="gauge-bg"/>
            <circle cx="60" cy="60" r="50" class="gauge-fill" id="gaugeFill"/>
          </svg>
          <div class="gauge-center">
            <span id="probValue">0</span><span class="percent-sign">%</span>
            <small>risk score</small>
          </div>
        </div>

        <div class="result-info">
          <span id="riskBadge" class="badge">—</span>
          <div class="result-stats">
            <div>
              <span class="stat-label">Probability</span>
              <span id="statProb" class="stat-value">—</span>
            </div>
            <div>
              <span class="stat-label">Threshold</span>
              <span id="statThreshold" class="stat-value">—</span>
            </div>
            <div>
              <span class="stat-label">Verdict</span>
              <span id="statVerdict" class="stat-value">—</span>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">Powered by your trained credit-risk model</footer>

  <script src="/static/script.js"></script>
</body>
</html>
